<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Test calculator</title>
    <link rel="stylesheet" href="Test calculator.css">
</head>
<body>
    <main>
        <div class="Display">
            0
        </div>
        <div class="Content">
            <div class="top">
                <button class="clear-button">AC</button>
                <button class="signchange">
                    <i class="fa-solid fa-plus-minus"></i>
                </button>
                <button id="percentage">
                    <i class="fa-solid fa-percent"></i>
                </button>
            </div>
            <div class="bottom">
            <button id="One">
            <i class="fa-solid fa-1"></i>
            </button>
            <button id="Two">
            <i class="fa-solid fa-2"></i>
            </button>
            <button id="Three">
            <i class="fa-solid fa-3"></i>
            </button>
            <button id="Four">
               <i class="fa-solid fa-4"></i> 
            </button>
            <button id="Five">
                <i class="fa-solid fa-5"></i>
            </button>
            <button id="Six">
                <i  class="fa-solid fa-6"></i>
            </button>
            <button id="Seven">
                <i  class="fa-solid fa-7"></i>
            </button>
            <button id="Eight">
                <i  class="fa-solid fa-8"></i>
            </button>
            <button id="Nine">
                <i class="fa-solid fa-9"></i>
            </button>
            <button id="Zero">
                <i class="fa-solid fa-0"></i>
            </button>
            <button id="clear-Entry">
                <i class="fa-solid fa-delete-left"></i>
            </button>
            <button id="dot">.</button>
            </div>
        </div>
        <div class="Right-sidebar">
            <button>
                    <i id="Addition" class="fa-solid fa-plus"></i>
                </button>
                <button>
                    <i id="Subtract" class="fa-solid fa-minus"></i>
                </button>
                <button>
                    <i id="Divide" class="fa-solid fa-divide"></i>
                </button>
                <button>
                    <i id="Multiplication" class="fa-solid fa-xmark"></i>
                </button>
                <button>
                <i id="Equal" class="fa-solid fa-equals"></i>
                </button>       
        </div>
    </main>
    <script src="Test calculator.js"></script>
</body>
</html>
